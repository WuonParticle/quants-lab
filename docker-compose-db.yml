services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=timescaledb
      # - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
      - "8080:5432" # for debugging from wsl
    volumes:
      - /mnt/timescaledisk/pgdata:/var/lib/postgresql/data
      - ./postgres_conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    restart: unless-stopped
    networks:
      - hummingbot-vpn  

  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=quants_lab
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - mongodb_network
      - hummingbot-vpn  

networks:
  mongodb_network:
    driver: bridge
  hummingbot-vpn:
    external: true

volumes:
  # 
  # timescale_data:
  mongodb_data:
